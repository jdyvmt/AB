<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afwezige leerkrachten Atheneum Brugge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 1. FULL SCREEN & VERLICHTE ACHTERGROND */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background: #0f172a linear-gradient(135deg, #1e293b 0%, #0f172a 100%) no-repeat fixed !important;
            color: #f8fafc;
            font-family: 'Lato', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            padding: 25px 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 2. HEADER: DATUM */
        .header-section {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 10px;
        }

        .date-badge {
            background: #3c9ca8;
            color: white;
            padding: 6px 18px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #live-datum {
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            font-weight: 600;
            color: #ffffff;
        }

        /* 3. AFWEZIGEN */
        .absence-box {
            background: rgba(30, 41, 59, 0.8);
            padding: 12px 25px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 8px solid #ef4444;
        }

        .absence-title {
            color: #ef4444;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 18px;
            text-transform: uppercase;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #live-afwezigen {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        /* 4. PLANNER: MATRIX TIMETABLE WITH FIXED WIDTHS */
        .table-container {
            flex-grow: 1;
            background: rgba(30, 41, 59, 0.65);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(94, 234, 212, 0.4);
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            background-color: #111827;
            color: #5eead4 !important;
            text-align: left;
            padding: 12px 25px;
            font-family: 'Poppins', sans-serif !important;
            font-size: 22px !important;
            font-weight: 700 !important;
            text-transform: uppercase;
            border-bottom: 4px solid #5eead4;
            height: 50px;
        }

        td {
            padding: 0 25px;
            border-bottom: 2px solid rgba(94, 234, 212, 0.15);
            vertical-align: middle;
            text-align: left;
            line-height: 1.2;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr:nth-child(odd) {
            background-color: rgba(0, 0, 0, 0.1);
        }

        /* HIGHLIGHTING ACTUELE LESUUR (Duidelijk opvallend) */
        tr.active-hour {
            background-color: rgba(94, 234, 212, 0.2) !important;
            border-left: 6px solid #5eead4;
        }

        tr.active-hour td.hour-col {
            color: #ffffff !important;
            background-color: #3c9ca8;
        }

        .hour-col {
            width: 15% !important;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: #5eead4 !important;
            font-size: 24px;
            border-right: 2px solid rgba(94, 234, 212, 0.3);
            text-align: center;
        }

        .class-col {
            width: 85% !important;
            font-weight: 600;
            color: #ffffff;
            padding-left: 35px;
            white-space: normal; 
            word-wrap: break-word;
        }

        .middagpauze-cel {
            border-bottom: 5px solid #5eead4 !important;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* 5. FOOTER */
        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
            font-family: 'Poppins', sans-serif;
            padding-top: 5px;
        }

        .footer-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #22c55e;
        }

        .status-dot.offline {
            background-color: #ef4444;
        }
    </style>
</head>
<body>

<div class="slide-container">
    <div class="header-section">
        <div class="date-badge">Datum</div>
        <div id="live-datum">Even geduld...</div>
    </div>

    <div class="absence-box">
        <div class="absence-title">
            <i class="fa-solid fa-user-slash"></i> Afwezige leerkrachten
        </div>
        <div id="live-afwezigen">Gegevens ophalen...</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="hour-col" style="text-align: center;">Uur / Tijd</th>
                    <th class="class-col">Klassen</th>
                </tr>
            </thead>
            <tbody id="tabel-body">
            </tbody>
        </table>
    </div>

    <div class="footer-info">
        <div class="footer-status">
            <span id="status-dot" class="status-dot"></span>
            <i class="fa-solid fa-sync"></i>
            <span>Laatste update: <span id="update-time">--:--</span></span>
        </div>
        <div>Atheneum Brugge</div>
    </div>
</div>

<script>
    const csvBaseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvnc7njfJTFzjePjpse17li2YOorDQ_j20h5rFfE8cMfsPo5L_DXdGjNBGvTki-Mq_uqYQFdRScgeW/pub?output=csv';

    function splitCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }

    function formatToDutchDate(dateStr) {
        if (!dateStr) return "geen datum opgegeven";
        const cleanStr = dateStr.replace(/"/g, '').trim();
        const parts = cleanStr.split(/[-/]/);
        let dateObj;
        
        if (parts.length === 3) {
            if (parts[0].length <= 2 && parts[2].length === 4) {
                dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
            } else if (parts[0].length === 4) {
                dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            }
        }

        if (!dateObj || isNaN(dateObj.getTime())) {
            dateObj = new Date(Date.parse(cleanStr));
        }

        if (isNaN(dateObj.getTime())) {
            return cleanStr.toLowerCase();
        }

        const opties = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        return dateObj.toLocaleDateString('nl-BE', opties).toLowerCase();
    }

    // Zet een tijdstring zoals "8.30u" of "8:30" om naar totaal aantal minuten vanaf middernacht
    function parseTimeToMinutes(timeStr) {
        if (!timeStr) return null;
        const clean = timeStr.replace(/["u]/g, '').trim().replace('.', ':');
        const parts = clean.split(':');
        if (parts.length >= 2) {
            const hours = parseInt(parts[0], 10);
            const minutes = parseInt(parts[1], 10);
            if (!isNaN(hours) && !isNaN(minutes)) {
                return hours * 60 + minutes;
            }
        }
        return null;
    }

    async function updateScreen() {
        const statusDot = document.getElementById('status-dot');
        try {
            const response = await fetch(`${csvBaseUrl}&t=${Date.now()}`);
            if (!response.ok) throw new Error("Netwerkfout");

            const rawData = await response.text();
            const rows = rawData.split(/\r?\n/).map(row => splitCSVLine(row));

            const datumEl = document.getElementById('live-datum');
            const afwezigenEl = document.getElementById('live-afwezigen');
            const tabelEl = document.getElementById('tabel-body');
            const updateEl = document.getElementById('update-time');

            if (!datumEl || !afwezigenEl || !tabelEl || updateEl === null) return;

            const rawDatum = rows[1]?.[1];
            datumEl.innerText = rawDatum ? formatToDutchDate(rawDatum) : "geen datum opgegeven";

            const rawAfwezigen = rows[3]?.[1]?.replace(/"/g, '').trim();
            afwezigenEl.innerText = rawAfwezigen || "Joepie! Geen afwezigen!";

            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let parsedRows = [];
            for (let i = 6; i <= 13; i++) {
                let uurStr = rows[i]?.[0] ? rows[i][0].replace(/"/g, '').trim() : '';
                let klassen = rows[i]?.[1] ? rows[i][1].replace(/"/g, '').trim() : '-';
                let startMins = parseTimeToMinutes(uurStr);
                
                if (uurStr) {
                    parsedRows.push({ uurStr, klassen, startMins });
                }
            }

            let tableHtml = '';
            for (let index = 0; index < parsedRows.length; index++) {
                const currentRow = parsedRows[index];
                let startMins = currentRow.startMins;
                
                // Bepaal de eindtijd: als er een volgend uur is, start dat volgende uur de eindtijd. 
                // Anders rekenen we standaard 50 minuten uit tot het einde van het lesblok.
                let endMins;
                if (parsedRows[index + 1] && parsedRows[index + 1].startMins !== null) {
                    endMins = parsedRows[index + 1].startMins;
                } else {
                    endMins = startMins !== null ? startMins + 50 : 9999;
                }

                let isActive = (startMins !== null && currentMinutes >= startMins && currentMinutes < endMins);

                let size = 28; 
                if (currentRow.klassen.length > 100) size = 20;
                else if (currentRow.klassen.length > 60) size = 24;

                let pauzeClass = '';
                if (currentRow.uurStr.includes("12.") || currentRow.uurStr.includes("13.")) {
                    pauzeClass = 'middagpauze-cel';
                }

                tableHtml += `
                    <tr class="${isActive ? 'active-hour' : ''}">
                        <td class="hour-col ${pauzeClass}">${currentRow.uurStr}</td>
                        <td class="class-col ${pauzeClass}" style="font-size: ${size}px;">${currentRow.klassen || '-'}</td>
                    </tr>
                `;
            }
            tabelEl.innerHTML = tableHtml;

            updateEl.innerText = now.toLocaleTimeString('nl-BE', {hour: '2-digit', minute:'2-digit'});
            if (statusDot) statusDot.classList.remove('offline');

        } catch (err) {
            console.error("Fout bij inladen data:", err);
            if (statusDot) statusDot.classList.add('offline');
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateScreen();
        setInterval(updateScreen, 30000);
    });
</script>

</body>
</html>
