<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afwezige leerkrachten Atheneum Brugge - TV Signage</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at 15% 15%, #1e293b 0%, #0f172a 70%, #090d16 100%);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            gap: 12px;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .glass-panel-active {
            background: linear-gradient(135deg, rgba(15, 118, 110, 0.35) 0%, rgba(30, 41, 59, 0.9) 100%);
            border: 2px solid #5eead4 !important;
            box-shadow: 0 0 25px rgba(94, 234, 212, 0.3);
        }
        .glass-badge {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }
        .text-glow {
            text-shadow: 0 0 16px rgba(94, 234, 212, 0.4);
        }
        .text-glow-orange {
            text-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            flex-shrink: 0;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        .card-afwezigen {
            padding: 16px;
            border-left: 8px solid #f43f5e;
            flex-shrink: 0;
        }
        .rooster-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .rooster-header {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(94, 234, 212, 0.3);
            padding: 10px 24px;
            font-size: 12px;
            font-weight: 800;
            color: #5eead4;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }
        .rooster-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .rooster-row {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            padding: 8px 24px;
            align-items: center;
            flex: 1;
            border-bottom: 1px solid rgba(30, 41, 59, 0.6);
        }
        .pause-row {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            background: rgba(3, 7, 18, 0.8);
            border-top: 1px solid rgba(94, 234, 212, 0.2);
            border-bottom: 1px solid rgba(94, 234, 212, 0.2);
            padding: 8px 24px;
            align-items: center;
            flex: 1;
        }
        footer {
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="glass-panel">
        <div style="display: flex; align-items: center; gap: 24px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(to top right, #14b8a6, #38bdf8); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #030712; box-shadow: 0 10px 15px -3px rgba(20, 184, 166, 0.2);">
                AB
            </div>
            <div style="text-align: left; border-left: 1px solid rgba(51, 65, 85, 0.6); padding-left: 24px;">
                <div style="font-size: 12px; font-weight: 800; color: #2dd4bf; letter-spacing: 0.05em; text-transform: uppercase;" id="live-dag-label">LADEN...</div>
                <div style="font-size: 18px; font-weight: bold; color: #f1f5f9;" id="live-datum-str">Even geduld...</div>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
            <i class="fa-regular fa-clock" style="font-size: 24px; color: #5eead4;"></i>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 800; letter-spacing: -0.025em; color: #ffffff;" class="text-glow" id="digital-clock">
                00:00<span style="font-size: 20px; color: rgba(94, 234, 212, 0.7);" id="digital-clock-seconds">:00</span>
            </div>
        </div>
    </header>

    <!-- MIDDLE SECTION -->
    <main>
        <!-- Afwezige Leerkrachten Card -->
        <div class="glass-panel card-afwezigen">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div style="width: 40px; height: 40px; border-radius: 12px;" class="glass-badge" style="display: flex; align-items: center; justify-content: center; color: #f43f5e; font-size: 18px; font-weight: bold;">
                        <i class="fa-solid fa-user-slash"></i>
                    </div>
                    <div>
                        <span style="font-size: 11px; font-weight: 800; color: #f43f5e; letter-spacing: 0.05em; text-transform: uppercase; display: block;">Afwezige Leerkrachten</span>
                        <div style="font-size: 20px; font-weight: bold; color: #ffffff; margin-top: 2px;" class="text-glow-orange" id="afwezigen-tekst">
                            Laden van gegevens...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Timetable Table Container -->
        <div class="glass-panel rooster-wrapper">
            <div class="rooster-header">
                <div style="grid-column: span 2; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-hourglass-half"></i> Lesuur
                </div>
                <div style="grid-column: span 10; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-graduation-cap"></i> Klassen
                </div>
            </div>

            <div class="rooster-body" id="rooster-container">
                <!-- Dynamisch gevuld via JS -->
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="glass-panel">
        <div style="display: flex; align-items: center; gap: 24px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="status-dot" style="width: 10px; height: 10px; border-radius: 50%; background-color: #34d399;"></span>
                <span style="color: #e2e8f0; font-weight: 600;" id="connection-status">Live verbinding actief</span>
            </div>
            <div style="height: 16px; width: 1px; background-color: #334155;"></div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-arrows-rotate" style="color: #2dd4bf;"></i>
                <span>Laatste update: <strong style="color: #ffffff; font-family: monospace;" id="last-update-time">--:--</strong></span>
            </div>
        </div>
        <div style="font-weight: 600; color: #cbd5e1;">Atheneum Brugge</div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        var csvBaseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvnc7njfJTFzjePjpse17li2YOorDQ_j20h5rFfE8cMfsPo5L_DXdGjNBGvTki-Mq_uqYQFdRScgeW/pub?output=csv';

        var defaultSchedule = [
            { hour: 1, label: "1ste uur", startMin: 510, endMin: 560 },
            { hour: 2, label: "2de uur",  startMin: 560, endMin: 610 },
            { hour: 3, label: "3de uur",  startMin: 625, endMin: 675 },
            { hour: 4, label: "4de uur",  startMin: 675, endMin: 725 },
            { hour: 5, label: "5de uur",  startMin: 725, endMin: 775 },
            { isPause: true, label: "MIDDAGPAUZE", startMin: 775, endMin: 840 },
            { hour: 6, label: "6de uur",  startMin: 840, endMin: 890 },
            { hour: 7, label: "7de uur",  startMin: 890, endMin: 940 },
            { hour: 8, label: "8ste uur", startMin: 940, endMin: 990 }
        ];

        function splitCSVLine(line) {
            var result = [];
            var current = '';
            var inQuotes = false;
            for (var i = 0; i < line.length; i++) {
                var char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        function parseSheetDate(dateStr) {
            if (!dateStr) return null;
            var cleanStr = dateStr.replace(/"/g, '').trim();
            var parts = cleanStr.split(/[-/]/);
            var dateObj = null;

            if (parts.length === 3) {
                if (parts[0].length <= 2 && parts[2].length === 4) {
                    dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
                } else if (parts[0].length === 4) {
                    dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                }
            }

            if (!dateObj || isNaN(dateObj.getTime())) {
                dateObj = new Date(Date.parse(cleanStr));
            }

            return (dateObj && !isNaN(dateObj.getTime())) ? dateObj : null;
        }

        function calculateRelativeDateLabel(targetDate) {
            if (!targetDate) return "DATUM";
            var today = new Date();
            var todayReset = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            var targetReset = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());

            var diffTime = targetReset.getTime() - todayReset.getTime();
            var diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return "VANDAAG";
            if (diffDays === 1) return "MORGEN";
            if (diffDays === -1) return "GISTEREN";
            if (diffDays > 1) return "BINNEN " + diffDays + " DAGEN";
            return Math.abs(diffDays) + " DAGEN GELEDEN";
        }

        function updateClock() {
            var now = new Date();
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('digital-clock').childNodes[0].nodeValue = hours + ':' + minutes;
            document.getElementById('digital-clock-seconds').textContent = ':' + seconds;
        }

        function updateScreen() {
            fetch(csvBaseUrl + '&t=' + Date.now())
                .then(function(response) {
                    if (response.ok) {
                        return response.text();
                    }
                    throw new Error('Netwerkfout');
                })
                .then(function(rawData) {
                    var rows = rawData.split(/\r?\n/).map(function(row) {
                        return splitCSVLine(row);
                    });

                    var rawDatum = (rows[1] && rows[1][1]) ? rows[1][1] : null;
                    var parsedDate = parseSheetDate(rawDatum);
                    var now = new Date();

                    if (parsedDate) {
                        var options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                        document.getElementById('live-datum-str').textContent = parsedDate.toLocaleDateString('nl-BE', options);
                        document.getElementById('live-dag-label').textContent = calculateRelativeDateLabel(parsedDate);
                    } else {
                        document.getElementById('live-datum-str').textContent = "Geen datum opgegeven";
                        document.getElementById('live-dag-label').textContent = "ONBEKEND";
                    }

                    var rawAfwezigen = (rows[3] && rows[3][1]) ? rows[3][1].replace(/"/g, '').trim() : '';
                    var afwezigenEl = document.getElementById('afwezigen-tekst');
                    
                    if (rawAfwezigen && rawAfwezigen !== "") {
                        afwezigenEl.textContent = rawAfwezigen;
                    } else {
                        afwezigenEl.textContent = "Geen afwezigen gemeld vandaag!";
                    }

                    var currentMinutes = now.getHours() * 60 + now.getMinutes();
                    var todayReset = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    var isSheetToday = parsedDate && (new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate()).getTime() === todayReset.getTime());

                    var container = document.getElementById('rooster-container');
                    var html = '';

                    defaultSchedule.forEach(function(item) {
                        if (item.isPause) {
                            html += 
                                '<div class="pause-row">' +
                                    '<div style="grid-column: span 2; font-weight: 800; color: #fbbf24; font-size: 13px; display: flex; align-items: center; gap: 8px;">' +
                                        '<i class="fa-solid fa-utensils"></i> MIDDAGPAUZE' +
                                    '</div>' +
                                    '<div style="grid-column: span 10;"></div>' +
                                '</div>';
                            return;
                        }

                        var sheetRowIndex = 5 + item.hour;
                        var sheetRow = rows[sheetRowIndex] || [];
                        var hourTimeFromSheet = (sheetRow[0]) ? sheetRow[0].replace(/"/g, '').trim() : item.label;
                        var klassenTekst = (sheetRow[1]) ? sheetRow[1].replace(/"/g, '').trim() : '-';

                        var isActive = isSheetToday && (currentMinutes >= item.startMin && currentMinutes < item.endMin);

                        var fontSize = "18px";
                        if (klassenTekst.length > 90) fontSize = "13px";
                        else if (klassenTekst.length > 50) fontSize = "15px";

                        var rowStyle = isActive 
                            ? 'background: linear-gradient(135deg, rgba(15, 118, 110, 0.35) 0%, rgba(30, 41, 59, 0.9) 100%); border: 2px solid #5eead4; border-radius: 12px; margin: 2px 0; z-index: 10;' 
                            : '';

                        html += 
                            '<div class="rooster-row" style="' + rowStyle + '">' +
                                '<div style="grid-column: span 2; display: flex; align-items: center; gap: 12px;">' +
                                    '<span style="width: 30px; height: 30px; border-radius: 8px; ' + (isActive ? 'background: #5eead4; color: #030712; font-weight: 900;' : 'background: #1e293b; color: #5eead4; font-weight: bold;') + ' display: flex; align-items: center; justify-content: center; font-size: 13px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);">' +
                                        item.hour +
                                    '</span>' +
                                    '<span style="font-weight: 800; color: #ffffff; font-size: 15px; white-space: nowrap;">' + hourTimeFromSheet + '</span>' +
                                '</div>' +
                                '<div style="grid-column: span 10; font-weight: bold; color: #ffffff; font-size: ' + fontSize + '; letter-spacing: 0.025em;">' +
                                    (klassenTekst !== '-' ? klassenTekst : '<span style="color: #475569; font-weight: normal; font-style: italic;">Geen vervangingen / studie gemeld</span>') +
                                '</div>' +
                            '</div>';
                    });

                    container.innerHTML = html;

                    document.getElementById('last-update-time').textContent = now.toLocaleTimeString('nl-BE', {hour: '2-digit', minute:'2-digit'});
                    document.getElementById('connection-status').textContent = "Live verbinding actief";
                    document.getElementById('status-dot').style.backgroundColor = "#34d399";
                })
                .catch(function(err) {
                    console.error("Fout bij ophalen gegevens:", err);
                    document.getElementById('connection-status').textContent = "Offline / Buffermodus";
                    document.getElementById('status-dot').style.backgroundColor = "#f43f5e";
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            setInterval(updateClock, 1000);

            updateScreen();
            setInterval(updateScreen, 25000);
        });
    </script>
</body>
</html>
