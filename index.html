<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Afwezige leerkrachten Atheneum Brugge</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0f172a;
            background-image: radial-gradient(circle at 15% 15%, #1e293b 0%, #0f172a 70%, #090d16 100%);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .glass-panel {
            background: #1e293b;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            margin-bottom: 12px;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            margin-bottom: 12px;
        }
        .card-afwezigen {
            padding: 16px 24px;
            border-left: 8px solid #f43f5e;
            margin-bottom: 12px;
        }
        .rooster-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .rooster-header {
            display: flex;
            background: #0f172a;
            border-bottom: 1px solid rgba(94, 234, 212, 0.3);
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 800;
            color: #5eead4;
            text-transform: uppercase;
        }
        .rooster-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .rooster-row {
            display: flex;
            align-items: center;
            padding: 0 24px;
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .pause-row {
            display: flex;
            align-items: center;
            background: rgba(3, 7, 18, 0.7);
            padding: 0 24px;
            flex: 0.7;
            color: #fbbf24;
            font-weight: 800;
            font-size: 13px;
        }
        footer {
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
        }
        .col-uur { width: 22%; display: flex; align-items: center; }
        .col-klas { width: 78%; font-weight: 700; color: #ffffff; }
    </style>
</head>
<body>

    <header class="glass-panel">
        <div style="display: flex; align-items: center;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: #14b8a6; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #030712; margin-right: 20px;">
                AB
            </div>
            <div style="border-left: 1px solid rgba(255,255,255,0.15); padding-left: 20px;">
                <div style="font-size: 12px; font-weight: 800; color: #2dd4bf; text-transform: uppercase;" id="live-dag-label">LADEN...</div>
                <div style="font-size: 20px; font-weight: 700; color: #f1f5f9;" id="live-datum-str">Even geduld...</div>
            </div>
        </div>
        <div style="display: flex; align-items: center;">
            <i class="fa-regular fa-clock" style="font-size: 24px; color: #5eead4; margin-right: 12px;"></i>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 800; color: #ffffff;" id="digital-clock">
                00:00<span style="font-size: 20px; color: #5eead4;" id="digital-clock-seconds">:00</span>
            </div>
        </div>
    </header>

    <main>
        <div class="glass-panel card-afwezigen">
            <div style="display: flex; align-items: center;">
                <div style="width: 42px; height: 42px; border-radius: 10px; background: rgba(244, 63, 94, 0.2); display: flex; align-items: center; justify-content: center; color: #f43f5e; font-size: 18px; margin-right: 16px;">
                    <i class="fa-solid fa-user-slash"></i>
                </div>
                <div>
                    <span style="font-size: 11px; font-weight: 800; color: #f43f5e; text-transform: uppercase; display: block;">Afwezige Leerkrachten</span>
                    <div style="font-size: 22px; font-weight: 700; color: #ffffff; margin-top: 2px;" id="afwezigen-tekst">
                        Laden van gegevens...
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-panel rooster-wrapper">
            <div class="rooster-header">
                <div class="col-uur"><i class="fa-solid fa-hourglass-half" style="margin-right: 8px;"></i> Lesuur</div>
                <div class="col-klas" style="color: #5eead4;"><i class="fa-solid fa-graduation-cap" style="margin-right: 8px;"></i> Klassen</div>
            </div>
            <div class="rooster-body" id="rooster-container"></div>
        </div>
    </main>

    <footer class="glass-panel">
        <div style="display: flex; align-items: center;">
            <span id="status-dot" style="width: 10px; height: 10px; border-radius: 50%; background: #34d399; display: inline-block; margin-right: 8px;"></span>
            <span style="color: #e2e8f0; font-weight: 600; margin-right: 20px;" id="connection-status">Live verbinding actief</span>
            <span>Laatste update: <strong style="color: #ffffff;" id="last-update-time">--:--</strong></span>
        </div>
        <div style="font-weight: 600; color: #cbd5e1;">Atheneum Brugge</div>
    </footer>

    <script>
        var csvBaseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvnc7njfJTFzjePjpse17li2YOorDQ_j20h5rFfE8cMfsPo5L_DXdGjNBGvTki-Mq_uqYQFdRScgeW/pub?output=csv';

        var defaultSchedule = [
            { hour: 1, label: "1ste uur", startMin: 510, endMin: 560 },
            { hour: 2, label: "2de uur",  startMin: 560, endMin: 610 },
            { hour: 3, label: "3de uur",  startMin: 625, endMin: 675 },
            { hour: 4, label: "4de uur",  startMin: 675, endMin: 725 },
            { hour: 5, label: "5de uur",  startMin: 725, endMin: 775 },
            { isPause: true, label: "MIDDAGPAUZE", startMin: 775, endMin: 840 },
            { hour: 6, label: "6de uur",  startMin: 840, endMin: 890 },
            { hour: 7, label: "7de uur",  startMin: 890, endMin: 940 },
            { hour: 8, label: "8ste uur", startMin: 940, endMin: 990 }
        ];

        function splitCSVLine(line) {
            var result = [], current = '', inQuotes = false;
            for (var i = 0; i < line.length; i++) {
                var char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
                else current += char;
            }
            result.push(current);
            return result;
        }

        function parseSheetDate(dateStr) {
            if (!dateStr) return null;
            var cleanStr = dateStr.replace(/"/g, '').trim();
            var parts = cleanStr.split(/[-/]/);
            var dateObj = null;
            if (parts.length === 3) {
                if (parts[0].length <= 2 && parts[2].length === 4) dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
                else if (parts[0].length === 4) dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            }
            if (!dateObj || isNaN(dateObj.getTime())) dateObj = new Date(Date.parse(cleanStr));
            return (dateObj && !isNaN(dateObj.getTime())) ? dateObj : null;
        }

        function calculateRelativeDateLabel(targetDate) {
            if (!targetDate) return "DATUM";
            var today = new Date();
            var todayReset = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            var targetReset = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            var diffDays = Math.round((targetReset.getTime() - todayReset.getTime()) / 86400000);
            if (diffDays === 0) return "VANDAAG";
            if (diffDays === 1) return "MORGEN";
            if (diffDays === -1) return "GISTEREN";
            return diffDays > 1 ? "BINNEN " + diffDays + " DAGEN" : Math.abs(diffDays) + " DAGEN GELEDEN";
        }

        function updateClock() {
            var now = new Date();
            var h = ('0' + now.getHours()).slice(-2);
            var m = ('0' + now.getMinutes()).slice(-2);
            var s = ('0' + now.getSeconds()).slice(-2);
            document.getElementById('digital-clock').childNodes[0].nodeValue = h + ':' + m;
            document.getElementById('digital-clock-seconds').textContent = ':' + s;
        }

        function updateScreen() {
            fetch(csvBaseUrl + '&t=' + Date.now())
                .then(function(r) { if (r.ok) return r.text(); throw new Error('Err'); })
                .then(function(rawData) {
                    var rows = rawData.split(/\r?\n/).map(splitCSVLine);
                    var rawDatum = (rows[1] && rows[1][1]) ? rows[1][1] : null;
                    var parsedDate = parseSheetDate(rawDatum);
                    var now = new Date();

                    if (parsedDate) {
                        document.getElementById('live-datum-str').textContent = parsedDate.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                        document.getElementById('live-dag-label').textContent = calculateRelativeDateLabel(parsedDate);
                    }

                    var rawAfwezigen = (rows[3] && rows[3][1]) ? rows[3][1].replace(/"/g, '').trim() : '';
                    document.getElementById('afwezigen-tekst').textContent = rawAfwezigen || "Geen afwezigen gemeld vandaag!";

                    var currentMinutes = now.getHours() * 60 + now.getMinutes();
                    var todayReset = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    var isSheetToday = parsedDate && (new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate()).getTime() === todayReset.getTime());

                    var html = '';
                    defaultSchedule.forEach(function(item) {
                        if (item.isPause) {
                            html += '<div class="pause-row"><div class="col-uur" style="color:#fbbf24;"><i class="fa-solid fa-utensils" style="margin-right:8px;"></i> MIDDAGPAUZE</div><div class="col-klas"></div></div>';
                            return;
                        }
                        var sheetRow = rows[5 + item.hour] || [];
                        var uurTekst = sheetRow[0] ? sheetRow[0].replace(/"/g, '').trim() : item.label;
                        var klassenTekst = sheetRow[1] ? sheetRow[1].replace(/"/g, '').trim() : '-';
                        var isActive = isSheetToday && (currentMinutes >= item.startMin && currentMinutes < item.endMin);

                        var fontSize = klassenTekst.length > 90 ? "14px" : (klassenTekst.length > 50 ? "16px" : "19px");
                        var rowStyle = isActive ? 'background: rgba(15, 118, 110, 0.45); border: 2px solid #5eead4; border-radius: 10px;' : '';
                        var badgeStyle = isActive ? 'background: #5eead4; color: #030712;' : 'background: #0f172a; color: #5eead4;';

                        html += '<div class="rooster-row" style="' + rowStyle + '">' +
                                    '<div class="col-uur">' +
                                        '<span style="width:28px; height:28px; border-radius:6px; ' + badgeStyle + ' display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; margin-right:12px;">' + item.hour + '</span>' +
                                        '<span style="font-weight:800; color:#fff; font-size:15px;">' + uurTekst + '</span>' +
                                    '</div>' +
                                    '<div class="col-klas" style="font-size:' + fontSize + ';">' +
                                        (klassenTekst !== '-' ? klassenTekst : '<span style="color:#64748b; font-weight:400; font-style:italic;">Geen vervangingen / studie gemeld</span>') +
                                    '</div>' +
                                '</div>';
                    });

                    document.getElementById('rooster-container').innerHTML = html;
                    document.getElementById('last-update-time').textContent = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
                    document.getElementById('connection-status').textContent = "Live verbinding actief";
                    document.getElementById('status-dot').style.background = "#34d399";
                })
                .catch(function() {
                    document.getElementById('connection-status').textContent = "Offline / Buffermodus";
                    document.getElementById('status-dot').style.background = "#f43f5e";
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateClock(); setInterval(updateClock, 1000);
            updateScreen(); setInterval(updateScreen, 25000);
        });
    </script>
</body>
</html>
