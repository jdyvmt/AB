<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afwezige leerkrachten Atheneum Brugge - TV Signage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            teal: '#5eead4',
                            tealDark: '#0f766e',
                            navy: '#0f172a',
                            navyLight: '#1e293b',
                            accent: '#38bdf8',
                            coral: '#f43f5e',
                            amber: '#f59e0b'
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2.5s infinite ease-in-out',
                        'radar': 'radarSweep 4s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 25px rgba(94, 234, 212, 0.25), inset 0 0 15px rgba(94, 234, 212, 0.1)' },
                            '50%': { boxShadow: '0 0 45px rgba(94, 234, 212, 0.45), inset 0 0 25px rgba(94, 234, 212, 0.25)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom TV screen optimizations */
        body {
            background: radial-gradient(circle at 15% 15%, #1e293b 0%, #0f172a 70%, #090d16 100%);
            color: #f8fafc;
            user-select: none;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-active {
            background: linear-gradient(135deg, rgba(15, 118, 110, 0.35) 0%, rgba(30, 41, 59, 0.9) 100%);
            border: 2px solid #5eead4 !important;
        }

        .glass-badge {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .text-glow {
            text-shadow: 0 0 16px rgba(94, 234, 212, 0.4);
        }

        .text-glow-orange {
            text-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
        }
        
        /* Custom scrollbar override if content overflows */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-6 lg:p-8 font-sans">

    <!-- TOP HEADER -->
    <header class="flex justify-between items-center glass-panel rounded-2xl px-6 py-4 shadow-2xl">
        <!-- Logo Icon -->
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-tr from-teal-500 to-sky-400 flex items-center justify-center font-extrabold text-2xl text-slate-950 shadow-lg shadow-teal-500/20">
                AB
            </div>
        </div>

        <!-- Datum & Tijd -->
        <div class="flex items-center gap-8">
            <div class="text-right border-r border-slate-700/60 pr-8">
                <div class="text-xs font-bold text-teal-400 tracking-wider uppercase" id="live-dag-label">VANDAAG</div>
                <div class="text-xl font-bold text-slate-100" id="live-datum-str">Laden...</div>
            </div>
            
            <div class="flex items-center gap-3">
                <i class="fa-regular fa-clock text-2xl text-brand-teal"></i>
                <div class="font-mono text-4xl font-extrabold tracking-tight text-white text-glow" id="digital-clock">
                    00:00<span class="text-xl text-teal-400/70" id="digital-clock-seconds">:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MIDDLE SECTION: AFWEZIGEN BANNER + LESROOSTER GRID -->
    <main class="my-4 flex-1 flex flex-col gap-4 min-h-0">
        
        <!-- Afwezige Leerkrachten Card -->
        <div class="glass-panel rounded-2xl p-5 border-l-8 border-l-rose-500 shadow-xl relative overflow-hidden flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl glass-badge flex items-center justify-center text-rose-400 text-xl font-bold">
                        <i class="fa-solid fa-user-slash"></i>
                    </div>
                    <div>
                        <span class="text-xs font-extrabold text-rose-400 tracking-wider uppercase block">Afwezige Leerkrachten</span>
                        <div class="text-2xl font-bold text-white text-glow-orange mt-0.5" id="afwezigen-tekst">
                            Laden van gegevens...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Timetable Table / Cards Container -->
        <div class="glass-panel rounded-2xl flex-1 flex flex-col overflow-hidden border border-slate-700/50 shadow-2xl">
            <!-- Table Header -->
            <div class="grid grid-cols-12 bg-slate-900/90 border-b border-teal-500/30 px-6 py-3 text-xs font-extrabold text-brand-teal uppercase tracking-wider">
                <div class="col-span-3 flex items-center gap-2">
                    <i class="fa-solid fa-hourglass-half"></i> Uur / Tijd
                </div>
                <div class="col-span-9 flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap"></i> Betrokken Klassen & Lokaal / Opvang
                </div>
            </div>

            <!-- Table Body / Lesson Rows Container -->
            <div class="flex-1 divide-y divide-slate-800/60 overflow-y-auto" id="rooster-container">
                <!-- Dynamisch gevuld via JS -->
            </div>
        </div>
    </main>

    <!-- FOOTER: STATUS & TICKER -->
    <footer class="glass-panel rounded-2xl px-6 py-3 flex justify-between items-center text-xs font-medium text-slate-400 flex-shrink-0">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-slate-200 font-semibold" id="connection-status">Live verbinding actief</span>
            </div>
            <div class="h-4 w-px bg-slate-700"></div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-arrows-rotate text-teal-400"></i>
                <span>Laatste update: <strong class="text-white font-mono" id="last-update-time">--:--</strong></span>
            </div>
        </div>

        <!-- Interactive TV Simulator Toolbar for Testing -->
        <div class="flex items-center gap-3 bg-slate-900/90 px-4 py-1.5 rounded-xl border border-slate-700">
            <span class="text-teal-400 font-bold text-[11px] uppercase tracking-wider"><i class="fa-solid fa-sliders mr-1"></i> TV Test-modus:</span>
            <select id="sim-hour-select" class="bg-slate-800 text-white text-xs rounded border border-slate-600 px-2 py-0.5 focus:outline-none focus:border-teal-400">
                <option value="auto">⏱️ Echte tijd (Automatisch)</option>
                <option value="1">1ste uur (08:30)</option>
                <option value="2">2de uur (09:20)</option>
                <option value="3">3de uur (10:25)</option>
                <option value="4">4de uur (11:15)</option>
                <option value="5">5de uur (13:00)</option>
                <option value="6">6de uur (13:50)</option>
                <option value="7">7de uur (14:50)</option>
                <option value="8">8ste uur (15:40)</option>
            </select>
        </div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Google Sheet URL (CSV)
        const csvBaseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvnc7njfJTFzjePjpse17li2YOorDQ_j20h5rFfE8cMfsPo5L_DXdGjNBGvTki-Mq_uqYQFdRScgeW/pub?output=csv';

        // Standaard roosterstructuur voor Atheneum Brugge
        const defaultSchedule = [
            { hour: 1, label: "1ste uur", timeStr: "08:30 - 09:20", startMin: 510, endMin: 560 },
            { hour: 2, label: "2de uur",  timeStr: "09:20 - 10:10", startMin: 560, endMin: 610 },
            { hour: 3, label: "3de uur",  timeStr: "10:25 - 11:15", startMin: 625, endMin: 675 },
            { hour: 4, label: "4de uur",  timeStr: "11:15 - 12:05", startMin: 675, endMin: 725 },
            { isPause: true, label: "MIDDAGPAUZE", timeStr: "12:05 - 13:00", startMin: 725, endMin: 780 },
            { hour: 5, label: "5de uur",  timeStr: "13:00 - 13:50", startMin: 780, endMin: 830 },
            { hour: 6, label: "6de uur",  timeStr: "13:50 - 14:40", startMin: 830, endMin: 880 },
            { hour: 7, label: "7de uur",  timeStr: "14:50 - 15:40", startMin: 890, endMin: 940 },
            { hour: 8, label: "8ste uur", timeStr: "15:40 - 16:30", startMin: 940, endMin: 990 }
        ];

        let simulatedHour = "auto";

        // CSV Parser
        function splitCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        // Live Klok Update
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('digital-clock').childNodes[0].nodeValue = `${hours}:${minutes}`;
            document.getElementById('digital-clock-seconds').textContent = `:${seconds}`;

            // Datumstring opmaken
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const formattedDate = now.toLocaleDateString('nl-BE', options);
            document.getElementById('live-datum-str').textContent = formattedDate;
        }

        // Parse Tijd naar Minuten
        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const clean = timeStr.replace(/["u]/g, '').trim().replace('.', ':');
            const parts = clean.split(':');
            if (parts.length >= 2) {
                const hours = parseInt(parts[0], 10);
                const minutes = parseInt(parts[1], 10);
                if (!isNaN(hours) && !isNaN(minutes)) {
                    return hours * 60 + minutes;
                }
            }
            return null;
        }

        // Hoofdfunctie schermverversing
        async function updateScreen() {
            try {
                // Fetch CSV met cache busting
                const response = await fetch(`${csvBaseUrl}&t=${Date.now()}`);
                let rows = [];
                if (response.ok) {
                    const rawData = await response.text();
                    rows = rawData.split(/\r?\n/).map(row => splitCSVLine(row));
                }

                // Datum uit sheet of huidige datum
                const rawDatum = rows[1]?.[1];
                if (rawDatum) {
                    document.getElementById('live-datum-str').textContent = rawDatum.replace(/"/g, '').trim();
                }

                // Afwezigen uitlezen
                const rawAfwezigen = rows[3]?.[1]?.replace(/"/g, '').trim();
                const afwezigenEl = document.getElementById('afwezigen-tekst');
                
                if (rawAfwezigen && rawAfwezigen !== "") {
                    afwezigenEl.textContent = rawAfwezigen;
                    afwezigenEl.classList.remove('text-emerald-400');
                    afwezigenEl.classList.add('text-white');
                } else {
                    afwezigenEl.textContent = "Geen afwezigen gemeld vandaag!";
                    afwezigenEl.classList.remove('text-white');
                    afwezigenEl.classList.add('text-emerald-400');
                }

                // Huidige tijd in minuten berekenen
                const now = new Date();
                const currentMinutes = now.getHours() * 60 + now.getMinutes();

                // Bouw lesuren rooster op
                const container = document.getElementById('rooster-container');
                let html = '';

                defaultSchedule.forEach((item) => {
                    if (item.isPause) {
                        // Middagpauze rij renderen
                        html += `
                            <div class="grid grid-cols-12 bg-slate-950/80 border-y border-teal-500/20 px-6 py-2.5 items-center">
                                <div class="col-span-3 font-extrabold text-amber-400 text-sm tracking-wider flex items-center gap-2">
                                    <i class="fa-solid fa-utensils"></i> PAUZE (${item.timeStr})
                                </div>
                                <div class="col-span-9 text-xs font-bold text-slate-400 uppercase tracking-widest">
                                    Middagpauze - Herneem lessen om 13:00u
                                </div>
                            </div>
                        `;
                        return;
                    }

                    // Haal klassen op uit Google Sheet rij (Rij 6 is 1ste uur, etc.)
                    const sheetRowIndex = 5 + item.hour; // Index in CSV sheet
                    let hourTimeFromSheet = rows[sheetRowIndex]?.[0]?.replace(/"/g, '').trim() || item.label;
                    let klassenTekst = rows[sheetRowIndex]?.[1]?.replace(/"/g, '').trim() || '-';

                    // Controleer actief lesuur
                    let isActive = false;
                    if (simulatedHour === "auto") {
                        isActive = (currentMinutes >= item.startMin && currentMinutes < item.endMin);
                    } else {
                        isActive = (parseInt(simulatedHour) === item.hour);
                    }

                    // Dynamische tekstgrootte afhankelijk van lengte
                    let fontSizeClass = "text-xl";
                    if (klassenTekst.length > 90) fontSizeClass = "text-base";
                    else if (klassenTekst.length > 50) fontSizeClass = "text-lg";

                    // Rij Stijl
                    const rowClass = isActive 
                        ? 'glass-panel-active animate-pulse-glow relative z-10 my-1 rounded-xl' 
                        : 'hover:bg-slate-800/40 transition-colors';

                    html += `
                        <div class="grid grid-cols-12 px-6 py-3.5 items-center ${rowClass}">
                            <!-- Lesuur nummer -->
                            <div class="col-span-3 flex items-center gap-3">
                                <span class="w-8 h-8 rounded-lg ${isActive ? 'bg-teal-400 text-slate-950 font-black' : 'bg-slate-800 text-teal-400 font-bold'} flex items-center justify-center text-sm shadow">
                                    ${item.hour}
                                </span>
                                <span class="font-extrabold text-white text-base">${hourTimeFromSheet}</span>
                            </div>

                            <!-- Klassen -->
                            <div class="col-span-9 font-bold text-white tracking-wide ${fontSizeClass}">
                                ${klassenTekst !== '-' ? klassenTekst : '<span class="text-slate-600 font-normal italic">Geen vervangingen / studie gemeld</span>'}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                // Footer timestamp
                document.getElementById('last-update-time').textContent = now.toLocaleTimeString('nl-BE', {hour: '2-digit', minute:'2-digit'});
                document.getElementById('connection-status').textContent = "Live verbinding actief";

            } catch (err) {
                console.error("Fout bij ophalen gegevens:", err);
                document.getElementById('connection-status').textContent = "Offline / Buffermodus";
            }
        }

        // Simulator Event Listener
        document.getElementById('sim-hour-select').addEventListener('change', (e) => {
            simulatedHour = e.target.value;
            updateScreen();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);

            updateScreen();
            setInterval(updateScreen, 25000); // 25s auto-refresh
        });
    </script>
</body>
</html>
